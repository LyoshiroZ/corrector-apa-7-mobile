name: Build Corrector APA 7 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Instalar dependencias sistema MINIMALES
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip curl autoconf libtool pkg-config \
          libncurses5-dev libtinfo5 build-essential \
          libssl-dev libffi-dev python3-dev python3-pip \
          libgl1-mesa-dev libgles2-mesa-dev libmtdev-dev \
          xclip lld ninja-build cmake locales \
          openjdk-17-jdk-headless libunwind-dev
        
        sudo locale-gen en_US.UTF-8
        
    - name: Instalar Cython + Buildozer
      run: |
        pip install --upgrade pip setuptools wheel
        pip install "cython==0.29.33"
        pip install buildozer==1.5.0
        
    - name: Configurar Java
      run: |
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "$JAVA_HOME/bin" >> $GITHUB_PATH
        
    - name: Crear usuario builder
      run: |
        sudo useradd -m -s /bin/bash builder || true
        echo "builder ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/builder
        
    - name: Crear licencias Android
      run: |
        sudo mkdir -p /home/builder/.android/licenses
        sudo mkdir -p .buildozer/android/platform/android-sdk/licenses
        
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee /home/builder/.android/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee .buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee /home/builder/.android/licenses/android-sdk-preview-license
        
        sudo chown -R builder:builder /home/builder .buildozer
        
    - name: Activar licencias en spec
      run: |
        sed -i '/android.accept_sdk_license/c\android.accept_sdk_license = True' buildozer.spec 2>/dev/null || echo "android.accept_sdk_license = True" >> buildozer.spec
        
    - name: Compilar APK
      run: |
        sudo -u builder -H bash -c "
          export USER=builder
          export HOME=/home/builder
          cd $GITHUB_WORKSPACE
          yes | yes | buildozer android debug
        "
        
    - name: Verificar resultado
      run: |
        ls -la bin/ || echo "No bin folder"
        
    - name: Upload APK/AAB
      uses: actions/upload-artifact@v4
      with:
        name: corrector-apa7-${{ github.sha }}
        path: bin/*
        retention-days: 30
        if-no-files-found: ignore
