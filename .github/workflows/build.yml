name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Docker Kivy)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Descarga el codigo del repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Cache de la carpeta .buildozer para no volver a descargar SDK/NDK en cada run
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-docker-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-docker-

      # 3. Compilar usando el contenedor oficial de Kivy
      #    - Ya tiene Java, NDK 26b, SDK, Python 3.11 y buildozer instalados
      #    - Evita todos los problemas de "yes: Broken pipe" y licencias
      - name: Compilar APK con Docker Kivy
        run: |
          docker run --rm \
            --volume "$(pwd)":/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug 2>&1 | tee build.log
          echo "--- Buscar el APK generado ---"
          find . -name "*.apk" 2>/dev/null || echo "No se encontro APK, revisa build.log"

      # 4. Subir el APK como artefacto descargable desde la pestana Actions
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: corrector-apa-7-apk
          path: bin/*.apk
          retention-days: 30

      # 5. Si el APK no se generó, subir el log para diagnóstico
      - name: Subir log si hay error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-error
          path: build.log
          retention-days: 7
