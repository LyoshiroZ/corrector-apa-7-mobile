name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🐍 Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: 📦 Instalar dependencias del sistema (Ubuntu 22.04)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          openjdk-17-jdk \
          git \
          zip \
          unzip \
          curl \
          autoconf \
          libtool \
          pkg-config \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          build-essential \
          libssl-dev \
          libffi-dev \
          python3-dev \
          python3-pip \
          python3-setuptools \
          python3-wheel \
          python3-cython \
          python3-virtualenv \
          libgl1-mesa-dev \
          libgles2-mesa-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libmtdev-dev \
          xclip \
          lld \
          ninja-build \
          cmake \
          wget \
          locales \
          locales-all
        # Configurar locale
        sudo locale-gen en_US.UTF-8
        sudo update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
        
    - name: ☕ Configurar variables Java 17
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
        java -version
        javac -version
        
    - name: 🐍 Instalar Python dependencies
      run: |
        pip install --upgrade pip setuptools wheel cython virtualenv
        pip install buildozer
        pip install kivy[base] kivymd
        
    - name: 🔧 Crear directorios Android necesarios
      run: |
        mkdir -p ~/.android
        mkdir -p .buildozer/android/platform/android-sdk/licenses
        
    - name: 📜 **CRÍTICO: Insertar licencias Android SDK (Hashes oficiales Google)**
      run: |
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > .buildozer/android/platform/android-sdk/licenses/android-sdk-license
        
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.android/licenses/android-sdk-preview-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > .buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        
        # Verificar que se crearon correctamente
        ls -la ~/.android/licenses/
        ls -la .buildozer/android/platform/android-sdk/licenses/
        cat ~/.android/licenses/android-sdk-license
        echo "✅ Licencias instaladas correctamente"
        
    - name: 🛠️ Configurar Buildozer.spec (si no existe)
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        # Configuraciones críticas para evitar errores
        sed -i 's/^# requirements =/requirements =/' buildozer.spec
        sed -i 's/^android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/^# android.gradle_dependencies =/android.gradle_dependencies =/' buildozer.spec
        
    - name: 🔒 Fix: Resolver error 'chown: invalid user'
      run: |
        # Crear usuario 'user' que espera Buildozer
        sudo useradd -m -s /bin/bash user
        sudo usermod -aG sudo user
        echo "user ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/user
        sudo chown -R user:user .
        sudo chmod -R 755 .
        
    - name: 🚀 **COMPILAR APK con licencias forzadas**
      run: |
        sudo -u user -H bash -c "
          export USER=user
          export HOME=/home/user
          export ANDROID_SDK_ROOT=\$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_NDK_ROOT=\$HOME/.buildozer/android/platform/android-ndk-r25c
          
          # Verificar licencias antes de build
          ls -la \$HOME/.android/licenses/
          cat \$HOME/.android/licenses/android-sdk-license
          
          cd /github/workspace
          yes | buildozer android debug -v
        "
      env:
        BUILD_NUMBER: ${{ github.run_number }}
        ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        
    - name: 📱 Verificar APK generado
      run: |
        ls -la bin/*.apk
        if [ -f bin/*.apk ]; then
          echo "✅ APK generado correctamente"
          du -sh bin/*.apk
        else
          echo "❌ No se encontró APK"
          exit 1
        fi
        
    - name: 📤 Subir APK como artifact
      uses: actions/upload-artifact@v4
      with:
        name: kivy-apk-${{ github.run_number }}
        path: bin/*.apk
        retention-days: 30
        compression-level: 0
        
    - name: 🌐 Opcional: Release automático (solo en main)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        files: bin/*.apk
        tag_name: v${{ github.run_number }}
        name: APK Build ${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
