name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y python3-pip git zip unzip openjdk-17-jdk \
            python3-setuptools autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip install --user buildozer cython==0.29.36
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compilar con Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          buildozer android debug

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: corrector-apa-apk
          path: bin/*.apk
