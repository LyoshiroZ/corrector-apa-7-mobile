name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK de prueba
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y python3-pip git zip unzip \
            python3-setuptools autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip install --user buildozer cython==0.29.36
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Aceptar Licencias de Android (Modo Manual)
        run: |
          # Instalamos el SDK manager por fuera para forzar licencias
          yes | sdkmanager --licenses || true
          
      - name: Compilar APK con Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Forzamos a Buildozer a no volver a preguntar
          buildozer android debug || buildozer android debug
        continue-on-error: false

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: corrector-apa-apk
          path: bin/*.apk
