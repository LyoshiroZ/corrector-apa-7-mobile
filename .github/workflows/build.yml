name: Compilar APK Android

# Se ejecuta cada vez que haces push a la rama main, o manualmente
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Cache de Buildozer (global)
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache de Buildozer (local)
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Compilar el APK con Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: corrector-apa-apk
          path: ${{ steps.buildozer.outputs.filename }}
          retention-days: 30
