name: Build Corrector APA 7 - FINAL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip curl autoconf libtool pkg-config \
          libncurses5-dev libtinfo5 build-essential libssl-dev \
          libffi-dev python3-dev libgl1-mesa-dev libgles2-mesa-dev \
          libmtdev-dev xclip lld ninja-build cmake \
          openjdk-17-jdk-headless libunwind-dev
        
    - name: Instalar Python tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install "cython==0.29.33"
        python3 -m pip install buildozer==1.5.0
        
    - name: Configurar entorno
      run: |
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "$JAVA_HOME/bin" >> $GITHUB_PATH
        
    - name: Licencias Android
      run: |
        mkdir -p ~/.android/licenses
        mkdir -p .buildozer/android/platform/android-sdk/licenses
        
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > .buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.android/licenses/android-sdk-preview-license
        
    - name: Configurar buildozer.spec
      run: |
        sed -i '/android.accept_sdk_license/c\android.accept_sdk_license = True' buildozer.spec 2>/dev/null || echo "android.accept_sdk_license = True" >> buildozer.spec
        
    - name: Build APK - SIN sudo
      run: |
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        export ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r25b
        yes | buildozer android debug
        
    - name: Verificar APK
      run: |
        ls -la bin/
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: corrector-apa7-${{ github.sha }}
        path: bin/*
        retention-days: 30
