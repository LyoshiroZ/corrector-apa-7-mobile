name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          openjdk-17-jdk git zip unzip curl autoconf libtool pkg-config \
          libncurses5-dev libncursesw5-dev libtinfo5 build-essential \
          libssl-dev libffi-dev python3-dev python3-pip python3-setuptools \
          python3-wheel python3-virtualenv libgl1-mesa-dev \
          libgles2-mesa-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          libmtdev-dev xclip lld ninja-build cmake wget
        
    - name: Configurar Java 17
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
        
    - name: Instalar Buildozer y Cython vía PIP
      run: |
        pip install --upgrade pip setuptools wheel virtualenv
        pip install cython==0.29.33
        pip install buildozer
        pip install kivy[base] kivymd
        
    - name: Preparar licencias Android
      run: |
        mkdir -p ~/.android/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.android/licenses/android-sdk-preview-license
        
    - name: Configurar Buildozer.spec
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        sed -i 's/^# requirements =/requirements =/' buildozer.spec
        sed -i 's/^android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        
    - name: Fix permisos de usuario
      run: |
        sudo useradd -m -s /bin/bash builder
        sudo usermod -aG sudo builder
        echo "builder ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/builder
        sudo chown -R builder:builder .
        
    - name: Compilar APK
      run: |
        sudo -u builder -H bash -c "yes | buildozer android debug"
        
    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: apu-apa-apk
        path: bin/*.apk
    
