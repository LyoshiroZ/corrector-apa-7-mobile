name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Docker Kivy)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-docker-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-docker-

      # Pre-aceptar todas las licencias del Android SDK
      # Los hashes son los hashes oficiales de Google para cada licencia
      - name: Aceptar licencias Android SDK
        run: |
          mkdir -p bin
          mkdir -p .buildozer/android/platform/android-sdk/licenses
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" \
            > .buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" \
            > .buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          printf "33b6937e7c023ef4a5e14a0c39b7c77c81a700f7\n" \
            > .buildozer/android/platform/android-sdk/licenses/google-gdk-license
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" \
            > .buildozer/android/platform/android-sdk/licenses/intel-android-extra-license
          echo "Licencias escritas:"
          ls -la .buildozer/android/platform/android-sdk/licenses/

      - name: Compilar APK con Docker Kivy
        run: |
          docker run --rm \
            --volume "$(pwd)":/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug
          echo "=== Archivos en bin/ ==="
          find "$(pwd)/bin" -type f 2>/dev/null || echo "bin/ vacia"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: corrector-apa-7-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Subir log si hay error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-error
          path: "*.log"
          retention-days: 7
