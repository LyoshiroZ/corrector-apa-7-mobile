name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Docker Kivy)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cacheamos el HOME del contenedor (donde Docker guarda SDK, NDK y licencias)
      - name: Cache buildozer home del contenedor
        uses: actions/cache@v4
        with:
          path: ~/.buildozer_cache
          key: buildozer-home-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-home-

      # Escribimos las licencias en la carpeta que el contenedor realmente usa
      - name: Aceptar licencias Android SDK
        run: |
          mkdir -p bin
          mkdir -p ~/.buildozer_cache/android/platform/android-sdk/licenses
          # Hashes oficiales de Google para android-sdk-license
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" \
            > ~/.buildozer_cache/android/platform/android-sdk/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" \
            > ~/.buildozer_cache/android/platform/android-sdk/licenses/android-sdk-preview-license
          printf "33b6937e7c023ef4a5e14a0c39b7c77c81a700f7\n" \
            > ~/.buildozer_cache/android/platform/android-sdk/licenses/google-gdk-license
          echo "Licencias escritas en: ~/.buildozer_cache/android/platform/android-sdk/licenses/"
          ls ~/.buildozer_cache/android/platform/android-sdk/licenses/

      - name: Compilar APK con Docker Kivy
        run: |
          docker run --rm \
            --volume "$(pwd)":/home/user/hostcwd \
            --volume "$HOME/.buildozer_cache":/home/user/.buildozer \
            kivy/buildozer:latest \
            android debug
          echo "=== Archivos en bin/ ==="
          find "$(pwd)/bin" -type f 2>/dev/null || echo "bin/ vacia"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: corrector-apa-7-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Subir log si hay error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-error
          path: "*.log"
          retention-days: 7
