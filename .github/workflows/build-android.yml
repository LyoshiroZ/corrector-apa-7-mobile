name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (Docker Kivy)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-docker-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-docker-

      - name: Preparar carpeta bin
        run: mkdir -p bin

      - name: Compilar APK con Docker Kivy
        run: |
          docker run --rm \
            --volume "$(pwd)":/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug
          echo "=== Archivos generados ==="
          find "$(pwd)/bin" -type f 2>/dev/null || echo "bin/ vacia"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: corrector-apa-7-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Subir log si hay error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-error
          path: "*.log"
          retention-days: 7
