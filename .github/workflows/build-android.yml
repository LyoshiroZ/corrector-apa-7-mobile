name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git zip unzip openjdk-17-jdk \
            python3-dev libffi-dev libssl-dev \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev libtinfo6 cmake \
            libgl1-mesa-dev libgles2-mesa-dev libmtdev-dev \
            xclip lld ninja-build libunwind-dev wget ca-certificates-java \
            liblzma-dev libbz2-dev libsqlite3-dev libreadline-dev \
            libgdbm-dev uuid-dev tk-dev libxml2-dev libxslt1-dev \
            xz-utils
          sudo update-ca-certificates -f || true

      - name: Instalar buildozer y cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade "cython==0.29.36" "buildozer>=1.5.0" virtualenv
          # Instalamos python-for-android directamente desde la rama master de GitHub.
          # Tiene los parches recientes para Python 3.11 + NDK 25 que NO estan en PyPI:
          # - Skip de modulo grp (setgrent/getgrent no existen en bionic)
          # - Build de _lzma con xz bundled (no necesita lzma.h del sistema)
          # - Skip de -luuid (Android no tiene libuuid)
          pip install --upgrade --force-reinstall \
            "git+https://github.com/kivy/python-for-android.git@master"

      # Cache v10: invalida v9 (que reusaba un Python roto cacheado de v8).
      # IMPORTANTE: cambiar este numero CADA VEZ que cambien deps de cross-compile.
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v10-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v10-

      # Pre-instalar el SDK completo con cmdline-tools en TODAS las rutas que buildozer puede buscar
      - name: Pre-instalar Android SDK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME

          # 1) Descargar e instalar cmdline-tools en su ruta moderna
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "Descargando Android cmdline-tools..."
            mkdir -p $ANDROID_HOME/cmdline-tools
            cd $ANDROID_HOME/cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            rm cmdline-tools.zip
          fi

          # 2) COPIAR (no symlink) el contenido completo a tools/ para la ruta legacy
          # Esto resuelve el ClassNotFoundException porque la estructura bin/ + lib/ queda intacta
          if [ ! -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            mkdir -p $ANDROID_HOME/tools
            cp -r $ANDROID_HOME/cmdline-tools/latest/* $ANDROID_HOME/tools/
          fi

          # 3) Pre-aceptar todas las licencias
          mkdir -p $ANDROID_HOME/licenses
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > $ANDROID_HOME/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > $ANDROID_HOME/licenses/android-sdk-preview-license
          printf "33b6937e7c023ef4a5e14a0c39b7c77c81a700f7\n" > $ANDROID_HOME/licenses/google-gdk-license
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" > $ANDROID_HOME/licenses/intel-android-extra-license

          # 4) Aceptar licencias adicionales con sdkmanager
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true

          # 5) Instalar componentes base del SDK (sin esto, buildozer fallaria al instalarlos)
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-33"

          echo "=== SDK preparado ==="
          ls $ANDROID_HOME/

      - name: Compilar APK
        env:
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer -v android debug

      - name: Listar APK generado
        if: always()
        run: |
          echo "=== Contenido de bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin/ vacia"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: corrector-apa-7-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Subir log si hay error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-error
          path: |
            .buildozer/**/*.log
            *.log
          retention-days: 7
