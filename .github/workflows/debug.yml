name: Build Corrector APA 7 - DEBUG LOGS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Dependencias mínimas
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip curl autoconf libtool pkg-config libncurses5-dev libtinfo5 build-essential libssl-dev libffi-dev libgl1-mesa-dev libgles2-mesa-dev libmtdev-dev xclip lld ninja-build cmake openjdk-17-jdk-headless libunwind-dev
        
    - name: Python tools
      run: |
        pip install --upgrade pip setuptools wheel cython==0.29.33 buildozer==1.5.0
        
    - name: Configurar Java
      run: |
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        
    - name: Licencias
      run: |
        mkdir -p ~/.android/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.android/licenses/android-sdk-preview-license
        ls -la ~/.android/licenses/
        
    - name: **DIAGNÓSTICO: Verificar spec**
      run: |
        cat buildozer.spec | grep -E "(requirements|ndk|api|license)"
        buildozer -v
        
    - name: **COMPILAR CON LOGS COMPLETOS**
      run: |
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        export ANDROID_NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r25b
        
        # LOG LEVEL 2 = VERBOSE
        buildozer android debug --log-level=2 > build_log.txt 2>&1 || cat build_log.txt
        
    - name: **SUBIR LOGS para debug**
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs-${{ github.sha }}
        path: |
          build_log.txt
          .buildozer/**/*.log
        retention-days: 7
